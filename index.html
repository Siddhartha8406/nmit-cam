<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D3S Surveillance Control</title>
    <style>
        body { 
            background: #0a0a0a; 
            color: #00ff41; 
            font-family: 'Courier New', monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container {
            border: 2px solid #00ff41;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
        }
        h1 { font-size: 1.5em; margin-bottom: 30px; letter-spacing: 2px; }
        #status { 
            margin: 20px; 
            padding: 10px;
            background: #1a1a1a;
            border-radius: 5px;
            min-width: 250px;
        }
        .btn { 
            padding: 20px 40px; 
            font-size: 1.2em; 
            font-weight: bold;
            background: #00ff41; 
            color: #000; 
            border: none; 
            cursor: pointer; 
            border-radius: 5px;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .btn:hover { background: #008f11; box-shadow: 0 0 15px #00ff41; }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="container">
        <h1>Synapse SYSTEM ACTIVE</h1>
        <div id="status">STATUS: STANDBY</div>
        <button class="btn" onclick="sendSignal()">Object Picked</button>
    </div>

    <script>
        // Update this URL with your n8n Production Webhook URL
        const N8N_URL = 'https://n8n-service-hnch.onrender.com/webhook-test/picked';

        function sendSignal() {
            const statusBox = document.getElementById('status');
            statusBox.innerText = "SENDING SIGNAL...";
            statusBox.style.color = "#ffff00";

            // Method changed to GET, body removed
            fetch(N8N_URL, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    statusBox.innerText = "SUCCESS: LOGGED TO TELEGRAM";
                    statusBox.style.color = "#00ff41";
                } else {
                    statusBox.innerText = "ERROR: SERVER REJECTED";
                    statusBox.style.color = "#ff0000";
                }
                // Reset status after 3 seconds
                setTimeout(() => {
                    statusBox.innerText = "STATUS: STANDBY";
                    statusBox.style.color = "#00ff41";
                }, 3000);
            })
            .catch(err => {
                statusBox.innerText = "CONNECTION FAILED";
                statusBox.style.color = "#ff0000";
                console.error('Fetch error:', err);
            });
        }
    </script>
</body>
</html>
